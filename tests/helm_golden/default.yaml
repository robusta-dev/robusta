spec:
  selector:
    matchLabels:
      app: robusta-forwarder
  replicas: 1
  revisionHistoryLimit: 10
  template:
    metadata:
      annotations:
        checksum/config: 952dee87e7365c0a8059fc912592ed601d41fe58e64068bb106540cee11461b8
      labels:
        app: robusta-forwarder
    spec:
      serviceAccountName: robusta-forwarder-service-account
      automountServiceAccountToken: true
      containers:
      - name: kubewatch
        # this is a custom version of kubewatch built from https://github.com/aantn/kubewatch
        image: robustadev/kubewatch:v2.16.1
        imagePullPolicy: IfNotPresent
        env:
          - name: KW_CONFIG
            value: /config
          - name: ENABLE_PPROF
            value: "true"
          
          - name: ADVANCED_FILTERS
