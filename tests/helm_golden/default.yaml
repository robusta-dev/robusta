# Robusta only creates resources in its own namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: robusta-runner-local-role
  namespace: robusta
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
      - persistentvolumeclaims
      - secrets
    verbs:
      - create
  # python client connects to exec via GET
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
