{{- if and (dig "enabled" true .Values.runner) .Values.runner.networkPolicy.enabled }}
{{- $strict := .Values.runner.networkPolicy.strict }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "robusta.fullname" . }}-runner
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "robusta.fullname" . }}-runner
  policyTypes:
    - Ingress
    {{- if $strict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 5000
          protocol: TCP
      {{- if $strict }}
      from:
        {{- include "robusta.runnerNetworkPolicyPeers" . | nindent 8 }}
      {{- end }}
    {{- with .Values.runner.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if $strict }}
  egress:
    - to:
        {{- include "robusta.runnerNetworkPolicyPeers" . | nindent 8 }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.runner.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
