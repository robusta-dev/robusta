  {{- end }} {{/* end of overrideClusterRoles if/else — when overrideClusterRoles is set, it replaces the built-in rules */}}

{{- if not .Values.runner.overrideClusterRoles }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-runner-role
  namespace: {{ .Release.Namespace }}
rules:
{{ include "robusta.runner.namespacedWriteRules" . | indent 2 }}
  {{- if not .Values.runner.clusterWideWriteAccess }}
{{ include "robusta.runner.scopedWriteRules" . | indent 2 }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "robusta.fullname" . }}-runner-service-account
  namespace: {{ .Release.Namespace }}
  {{- if .Values.runnerServiceAccount.annotations }}
  annotations:
  {{- with .Values.runnerServiceAccount.annotations }}
    {{- toYaml . | nindent 4}}
  {{- end }}
  {{- end }}
{{- $pullSecrets := .Values.runnerServiceAccount.imagePullSecrets | default .Values.global.imagePullSecrets }}
{{- if $pullSecrets }}
imagePullSecrets:
{{- toYaml $pullSecrets | nindent 2}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "robusta.fullname" . }}-runner-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "robusta.fullname" . }}-runner-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
{{- if not .Values.runner.overrideClusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "robusta.fullname" . }}-runner-role-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "robusta.fullname" . }}-runner-role
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.openshift.enabled }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-cluster-monitoring
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
{{- end }}
{{- end }} # runner.createServiceAccount