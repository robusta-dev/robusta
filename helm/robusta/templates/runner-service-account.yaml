{{- end }}
  {{- end }} {{/* end of overrideClusterRoles if/else — when overrideClusterRoles is set, it replaces the built-in rules */}}
{{- end }}

{{- /* Role rules for runner.rbac.namespaceScoped. Kubernetes refuses to create a Role holding
       permissions its creator lacks, even ones a Role cannot grant, so the result must stay within
       the built-in "admin" ClusterRole for a namespace admin to install it. Drop what a Role grants
       nothing for anyway (cluster-scoped resources, resources not served from the listed API
       group, nonResourceURLs), plus the few namespaced grants "admin" lacks and the runner can do
       without. */}}
{{- define "robusta.runner.namespacedRbacRules" }}
{{- $ungrantable := list
      "/nodes" "/namespaces" "/persistentvolumes"
      "/daemonsets" "/deployments" "/replicasets"
      "apiextensions.k8s.io/customresourcedefinitions"
      "apiregistration.k8s.io/apiservices"
      "rbac.authorization.k8s.io/clusterroles" "rbac.authorization.k8s.io/clusterrolebindings"
      "policy/podsecuritypolicies"
      "user.openshift.io/groups" "user.openshift.io/users"
      "pkg.crossplane.io/providers" "pkg.crossplane.io/configurations"
      "pkg.crossplane.io/providerrevisions" "pkg.crossplane.io/configurationrevisions"
      "apiextensions.crossplane.io/compositeresourcedefinitions"
      "apiextensions.crossplane.io/compositions"
      "gateway.networking.k8s.io/gatewayclasses"
      "keda.sh/clustertriggerauthentications"
      "external-secrets.io/clustersecretstores" "external-secrets.io/clusterexternalsecrets"
      "events.k8s.io/events" }}
{{- /* not writable by "admin"; reads stay */}}
{{- $readOnly := list "/pods/log" "/pods/status" }}
{{- $readVerbs := list "get" "list" "watch" }}
{{- /* nothing is served from the extensions group since Kubernetes 1.22 */}}
{{- $removedGroups := list "extensions" }}
{{- $rules := list }}
{{- range $rule := include "robusta.runner.rbacRules" . | fromYamlArray }}
  {{- if not (hasKey $rule "nonResourceURLs") }}
    {{- $groups := $rule.apiGroups | default list }}
    {{- $kept := list }}
    {{- range $resource := $rule.resources | default list }}
      {{- $drop := false }}
      {{- range $group := $groups }}
        {{- $key := printf "%s/%s" $group $resource }}
        {{- if or (has $group $removedGroups) (has $key $ungrantable) }}
          {{- $drop = true }}
        {{- end }}
        {{- if has $key $readOnly }}
          {{- range $verb := $rule.verbs }}
            {{- if not (has $verb $readVerbs) }}
              {{- $drop = true }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if not $drop }}
        {{- $kept = append $kept $resource }}
      {{- end }}
    {{- end }}
    {{- if $kept }}
      {{- $rules = append $rules (set (deepCopy $rule) "resources" $kept) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /* a Role can grant get on its own namespace object (NAMESPACE_DATA_MODE=namespaced) */}}
{{- $rules = append $rules (dict "apiGroups" (list "") "resources" (list "namespaces") "verbs" (list "get")) }}
{{- toYaml $rules }}
{{- end }}

{{- if .Values.runner.createServiceAccount }}
{{- /* namespaceScoped renders a namespaced Role (bound below with a RoleBinding), so the runner
       only gets access inside the release namespace. */}}
kind: {{ if .Values.runner.rbac.namespaceScoped }}Role{{ else }}ClusterRole{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-runner{{ if .Values.runner.rbac.namespaceScoped }}-role{{ else }}-cluster-role{{ end }}
  namespace : {{ .Release.Namespace }}
rules:
{{- if .Values.runner.rbac.namespaceScoped }}
{{ include "robusta.runner.namespacedRbacRules" . | indent 2 }}
{{- else }}
{{ include "robusta.runner.rbacRules" . }}
{{- end }}

{{- if not .Values.runner.rbac.disableCreateFromServiceAccount }}
---
# Robusta only creates resources in its own namespace
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-runner-local-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
      - persistentvolumeclaims
      - secrets
    verbs:
      - create
  # python client connects to exec via GET
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-runner-local-role-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "robusta.fullname" . }}-runner-local-role
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "robusta.fullname" . }}-runner-service-account
  namespace: {{ .Release.Namespace }}
  {{- if .Values.runnerServiceAccount.annotations }}
  annotations:
  {{- with .Values.runnerServiceAccount.annotations }}
    {{- toYaml . | nindent 4}}
  {{- end }}
  {{- end }}
{{- $pullSecrets := .Values.runnerServiceAccount.imagePullSecrets | default .Values.global.imagePullSecrets }}
{{- if $pullSecrets }}
imagePullSecrets:
{{- toYaml $pullSecrets | nindent 2}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.runner.rbac.namespaceScoped }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ include "robusta.fullname" . }}-runner{{ if .Values.runner.rbac.namespaceScoped }}-role-binding{{ else }}-cluster-role-binding{{ end }}
  {{- if .Values.runner.rbac.namespaceScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.runner.rbac.namespaceScoped }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "robusta.fullname" . }}-runner{{ if .Values.runner.rbac.namespaceScoped }}-role{{ else }}-cluster-role{{ end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
{{- if and .Values.openshift.enabled (not .Values.runner.rbac.namespaceScoped) }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-cluster-monitoring
subjects:
  - kind: ServiceAccount
    name: {{ include "robusta.fullname" . }}-runner-service-account
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
{{- end }}
{{- end }} # runner.createServiceAccount