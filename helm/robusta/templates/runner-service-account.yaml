{{/*
Write rules that Robusta only ever needs inside its own release namespace.
These are always granted through a namespaced Role, never cluster-wide.
*/}}
{{- define "robusta.runner.namespacedWriteRules" -}}
# Robusta's own workloads: KRR/Popeye/kubectl jobs, debug pods and the demo deployment,
# all created in the release namespace (INSTALLATION_NAMESPACE).
- apiGroups:
    - ""
  resources:
    - configmaps
    - persistentvolumeclaims
    - pods
  verbs:
    - create
    - delete
    - patch
    - update
# Secrets mounted into Robusta's own jobs. Only "create" - they are cleaned up by their
# owner reference, and Robusta never reads or updates them.
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - create
# Exec into the debug pods Robusta creates in its own namespace (node bash, py-spy, jmap).
# "get" is what the Kubernetes python client needs - it opens the exec stream with a GET request,
# which RBAC maps to "get" and not to "create" the way `kubectl exec` (a POST) does.
- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - get
    - create
- apiGroups:
    - batch
  resources:
    - jobs
  verbs:
    - create
    - delete
    - patch
- apiGroups:
    - apps
  resources:
    - deployments
  verbs:
    - create
    - delete
    - patch
{{- if .Values.enabledManagedConfiguration }}
# Managed alerts are written as PrometheusRules in the release namespace only.
- apiGroups:
    - "monitoring.coreos.com"
  resources:
    - prometheusrules
  verbs:
    - get
    - list
    - create
    - delete
    - patch
    - update
{{- end }}
{{- end }}
{{/*
Write rules for resources that belong to *other* workloads. Granted cluster-wide when
runner.clusterWideWriteAccess is true (the default), otherwise added to the namespaced Role
so remediation still works inside the release namespace only.
*/}}
{{- define "robusta.runner.scopedWriteRules" -}}
# Pod remediation and troubleshooting: delete_pod, volume_analysis reader pod.
- apiGroups:
    - ""
  resources:
    - pods
  verbs:
    - create
    - delete
# Run commands inside a target pod: pod_bash_enricher, volume_analysis. "get" opens the exec
# stream from the python client, "create" covers `kubectl exec` from kubectl enrichments.
- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - get
    - create
# Evict pods when draining a node.
- apiGroups:
    - ""
  resources:
    - pods/eviction
  verbs:
    - create
# disk_benchmark creates and deletes its PVC in a configurable namespace.
- apiGroups:
    - ""
  resources:
    - persistentvolumeclaims
  verbs:
    - create
    - delete
# rollout_restart annotates the pod template of an existing workload.
- apiGroups:
    - apps
  resources:
    - daemonsets
    - deployments
    - statefulsets
  verbs:
    - patch
# job_restart_on_oomkilled recreates a failed job with higher memory limits.
- apiGroups:
    - batch
  resources:
    - jobs
  verbs:
    - create
    - delete
# scale_hpa_callback updates an HPA's min/max replicas.
- apiGroups:
    - autoscaling
  resources:
    - horizontalpodautoscalers
  verbs:
    - patch
    - update
{{- if (.Capabilities.APIVersions.Has "snapshot.storage.k8s.io/v1/VolumeSnapshot") }}
# create_pvc_snapshot backs up a PersistentVolume.
- apiGroups:
    - snapshot.storage.k8s.io
  resources:
    - volumesnapshots
  verbs:
    - create
    - update
{{- end }}
{{- if .Values.argoRollouts }}
# rollout_restart on an Argo Rollout.
- apiGroups:
    - argoproj.io
  resources:
    - rollouts
  verbs:
    - patch
    - update
{{- end }}
{{- if has "StrimziPodSet" .Values.runner.customCRD }}
- apiGroups:
    - core.strimzi.io
  resources:
    - strimzipodsets
  verbs:
    - patch
    - update
{{- end }}
{{- if has "CNPGCluster" .Values.runner.customCRD }}
- apiGroups:
    - postgresql.cnpg.io
  resources:
    - clusters
  verbs:
    - patch
    - update
{{- end }}
{{- if has "ExecutionContext" .Values.runner.customCRD }}
- apiGroups:
    - hub.knime.com
  resources:
    - executioncontexts
  verbs:
    - patch
    - update
{{- end }}
{{- if .Values.openshift.enabled }}
# rollout_restart on an OpenShift DeploymentConfig.
- apiGroups:
    - apps.openshift.io
  resources:
    - deploymentconfigs
  verbs:
    - patch
    - update
# OpenShift's built-in monitoring stack integration.
- apiGroups:
    - monitoring.coreos.com
  resources:
    - servicemonitors
    - prometheusrules
    - alertmanagers
    - silences
    - podmonitors
  verbs:
    - create
    - update
    - patch
    - delete
    - deletecollection
{{- end }}
{{- end }}

{{- if .Values.runner.createServiceAccount }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "robusta.fullname" . }}-runner-cluster-role
  namespace : {{ .Release.Namespace }}
rules:
  {{- if .Values.runner.overrideClusterRoles }}
{{ toYaml .Values.runner.overrideClusterRoles | indent 2 }}
  {{- else }}
  {{- if .Values.runner.customClusterRoleRules }}
{{ toYaml .Values.runner.customClusterRoleRules | indent 2 }}
  {{- end }}
  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - "customresourcedefinitions"
    verbs:
      - "list"
      - "get"

  - apiGroups:
      - ""
    resources:
      - configmaps
      - daemonsets
      - deployments
      - events
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - pods/status
      - pods/log
      - replicasets
      - replicationcontrollers
      - services
      - serviceaccounts
      - endpoints
      {{- if .Values.monitorHelmReleases }}
      - secrets
      {{end}}
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      {{- if .Values.runner.clusterWideWriteAccess }}
      - patch  # cordon / uncordon. A Role cannot grant this - nodes are cluster-scoped.
      {{- end }}

  {{- if .Values.runner.clusterWideWriteAccess }}
{{ include "robusta.runner.scopedWriteRules" . | indent 2 }}
  {{- end }}

  - apiGroups:
      - "apiregistration.k8s.io"
    resources:
      - apiservices
    verbs:
      - get
      - list

  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "autoscaling"
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - deployments/scale
      - replicasets
      - replicasets/scale
      - statefulsets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - extensions
    resources:
      - daemonsets
      - deployments
      - deployments/scale
      - ingresses
      - replicasets
      - replicasets/scale
      - replicationcontrollers/scale
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - "events.k8s.io"
    resources:
      - events
    verbs:
      - get
      - list

  - apiGroups:
      - networking.k8s.io
    resources:
    - ingresses
    - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
    - horizontalpodautoscalers
    verbs:
      - get
      - list
  - apiGroups:
      - "policy"
    resources:
    - poddisruptionbudgets
    - podsecuritypolicies
    verbs:
      - get
      - list
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
    - clusterroles
    - clusterrolebindings
    - roles
    - rolebindings
    verbs:
      - get
      - list

{{- if (.Capabilities.APIVersions.Has "snapshot.storage.k8s.io/v1/VolumeSnapshot") }}
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - get
      - list
      - watch
{{- end }}
{{- if .Values.openshift.enabled }}
  - apiGroups:
    - apps.openshift.io
    resources:
    - deploymentconfigs
    verbs:
    - get
    - list
  - apiGroups:
    - user.openshift.io
    resources:
    - groups
    - users
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - security.openshift.io
    resources:
    - securitycontextconstraints
    verbs:
    - use
    resourceNames:
    - {{ if .Values.openshift.createScc }}"{{ include "robusta.fullname" . }}-scc"{{ else }}{{ .Values.openshift.sccName | quote }}{{ end }}
  - apiGroups:
    - monitoring.coreos.com
    resources:
    - servicemonitors
    - prometheusrules
    - alertmanagers
    - silences
    - podmonitors
    verbs:
    - get
    - list
    - watch
{{- if .Values.openshift.createPrivilegedScc }}
