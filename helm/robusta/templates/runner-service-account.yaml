{{- end }}
{{- if and .Values.runner.crdPermissions.crossplane (not .Values.runner.rbac.namespaceScoped) }}
  # Crossplane
  - apiGroups:
    - pkg.crossplane.io
    resources:
    - providers
    - configurations
    - providerrevisions
    - configurationrevisions
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - apiextensions.crossplane.io
    resources:
    - compositeresourcedefinitions
