{{- end }}
{{- end }}
{{- if .Values.argoRollouts }}
  - apiGroups:
    - argoproj.io
    resources:
    - rollouts
    verbs:
    - get
    - list
{{- end }}
{{- if has "StrimziPodSet" .Values.runner.customCRD }}
  - apiGroups:
    - core.strimzi.io
    resources:
    - strimzipodsets
    verbs:
    - get
    - list
{{- end }}
{{- if has "CNPGCluster" .Values.runner.customCRD }}
  - apiGroups:
