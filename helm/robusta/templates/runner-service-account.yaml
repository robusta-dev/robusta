    - update
{{- end }}
{{- if has "ExecutionContext" .Values.runner.customCRD }}
  - apiGroups:
    - hub.knime.com
    resources:
    - executioncontexts
    verbs:
    - get
    - list
    - patch
    - update
{{- end }}
