{{- if include "robusta.krrCronJobEnabled" . }}
{{- $fullname := include "robusta.fullname" . }}
{{- $krr := .Values.runner.krrCronJob }}
{{- $global := .Values.globalConfig }}
{{- $krrArgs := $krr.krrArgs | default $global.args | default $global.krr_args | default "" }}
{{- /* runner env vars that configured the scan job */}}
{{- $runnerEnv := dict }}
{{- range .Values.runner.additional_env_vars }}
{{- if and .valueFrom (has .name (list "KRR_IMAGE_OVERRIDE" "KRR_MEMORY_REQUEST" "KRR_MEMORY_LIMIT")) }}
{{- fail (printf "runner.additional_env_vars: %s needs a literal value for the KRR CronJob, or set it under runner.krrCronJob" .name) }}
{{- end }}
{{- $_ := set $runnerEnv .name (.value | default "" | toString) }}
{{- end }}
{{- $jobSpec := $krr.jobSpec | default $global.krr_job_spec | default dict }}
{{- range $field, $_ := $jobSpec }}
{{- if not (has $field (list "tolerations" "nodeSelector" "affinity" "priorityClassName" "imagePullSecrets" "topologySpreadConstraints" "schedulerName")) }}
{{- fail (printf "runner.krrCronJob.jobSpec: unsupported field %s" $field) }}
{{- end }}
{{- end }}
{{- $annotations := merge (dict) $krr.annotations ($global.custom_annotations | default dict) }}
{{- /* env var name -> configured value of each Prometheus credential */}}
{{- $credentials := dict }}
{{- if and $global.prometheus_auth (not $krr.prometheusAuthSecret.name) }}
{{- $_ := set $credentials "PROMETHEUS_AUTH_HEADER" $global.prometheus_auth }}
{{- end }}
{{- $headerFlags := list }}
{{- range $name, $value := $global.prometheus_additional_headers }}
{{- if not (regexMatch "^[A-Za-z0-9-]+$" $name) }}
{{- fail (printf "globalConfig.prometheus_additional_headers: illegal header name %s" $name) }}
{{- end }}
{{- $envName := printf "PROMETHEUS_HEADER_%s" ($name | upper | replace "-" "_") }}
{{- $_ := set $credentials $envName (toString $value) }}
{{- $headerFlags = append $headerFlags (printf "--prometheus-headers \"%s:$%s\"" $name $envName) }}
{{- end }}
{{- /* a "{{ env.X }}" value is read from env var X, any other value from the Secret below */}}
{{- $envReferences := dict }}
{{- $secretValues := dict }}
{{- range $envName, $value := $credentials }}
{{- $reference := regexReplaceAll "{{ *env\\.(\\w+) *}}" $value "$${${1}}" }}
{{- $_ := set (ternary $secretValues $envReferences (eq $reference $value)) $envName $reference }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-krr
  namespace: {{ .Release.Namespace }}
  labels:
    app: krr.robusta.dev
spec:
  schedule: {{ $krr.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app: krr.robusta.dev
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 43200
      activeDeadlineSeconds: {{ $krr.timeout | default $global.timeout | default 3600 }}
      template:
        metadata:
          labels:
            app: krr.robusta.dev
          {{- with $annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ $global.serviceAccountName | default .Values.runner.customServiceAccount | default (printf "%s-runner-service-account" $fullname) }}
          restartPolicy: Never
          {{- $pullSecrets := .Values.runner.imagePullSecrets | default .Values.global.imagePullSecrets }}
          {{- if and $pullSecrets (not $jobSpec.imagePullSecrets) }}
          imagePullSecrets:
          {{- toYaml $pullSecrets | nindent 10 }}
          {{- end }}
          {{- with $jobSpec }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          containers:
          - name: krr
            image: {{ $krr.image | default $runnerEnv.KRR_IMAGE_OVERRIDE | default (printf "%s/krr:v1.30.0" .Values.image.registry) }}
            imagePullPolicy: Always
            {{- if or .Values.runner.setKRRSecurityContext (eq (lower ($runnerEnv.SET_KRR_SECURITY_CONTEXT | default "")) "true") }}
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            {{- end }}
            command:
            - /bin/sh
            - -c
            - |
              SCAN_ID=$(python -c 'import uuid; print(uuid.uuid4())')
              START_TIME=$(python -c 'from datetime import datetime; print(datetime.now())')
              {{- range $envName, $reference := $envReferences }}
              {{ $envName }}="{{ $reference }}"
              {{- end }}
              if [ -z "$AWS_REGION" ] && [ -n "$CORALOGIX_PROMETHEUS_TOKEN" ]; then
                PROMETHEUS_AUTH_HEADER="Bearer $CORALOGIX_PROMETHEUS_TOKEN"
                set -- "$@" --coralogix-token "$CORALOGIX_PROMETHEUS_TOKEN"
              fi
              case "$PROMETHEUS_AUTH_HEADER|$IS_OPENSHIFT|$PROMETHEUS_CLUSTER_TOKEN_AUTH" in
                "|"*[Tt][Rr][Uu][Ee]*) PROMETHEUS_AUTH_HEADER="Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" ;;
              esac
              if [ -n "$PROMETHEUS_AUTH_HEADER" ]; then
                set -- "$@" --prometheus-auth-header "$PROMETHEUS_AUTH_HEADER"
              fi
              if [ -n "$AWS_REGION" ]; then
                set -- "$@" --eks-managed-prom --eks-managed-prom-region "$AWS_REGION" --eks-service-name "${AWS_SERVICE_NAME:-aps}"
              fi
              if [ -n "$AWS_REGION" ] && [ -n "$AWS_ASSUME_ROLE" ]; then
                set -- "$@" --eks-assume-role "$AWS_ASSUME_ROLE"
              fi
              if [ -n "$AWS_REGION" ] && [ -n "$AWS_ACCESS_KEY" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
                set -- "$@" --eks-access-key "$AWS_ACCESS_KEY" --eks-secret-key "$AWS_SECRET_ACCESS_KEY"
              fi
              exec python krr.py {{ with $krr.strategy }}{{ . | quote }}{{ else }}"${KRR_STRATEGY:-{{ $global.strategy | default "simple" }}}"{{ end }} \
                --publish_scan_url="${KRR_PUBLISH_URL:-http://{{ $fullname }}-runner.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}/api/trigger}" \
                --scan_id="$SCAN_ID" --start_time="$START_TIME" --named_sinks=robusta_ui_sink \
                {{ $krrArgs }} \
                {{- $labels := $global.prometheus_additional_labels | default dict }}
                {{- if and (eq (len $labels) 1) (not (contains "-l" $krrArgs)) }}
                {{- range $label, $value := $labels }}
                --prometheus-label {{ $label | replace "'" "'\\''" | squote }} -l {{ $value | toString | replace "'" "'\\''" | squote }} \
                {{- end }}
                {{- end }}
                --max-workers {{ $krr.maxWorkers | default $global.max_workers | default 3 }} {{ if or $krr.verbose $global.krr_verbose }}-v {{ end }}-f json --width 2048 \
                {{- with $global.prometheus_url }}
                {{- $reference := regexReplaceAll "{{ *env\\.(\\w+) *}}" . "$${${1}}" }}
                -p {{ eq $reference . | ternary (. | replace "'" "'\\''" | squote) (printf "\"%s\"" $reference) }} \
                {{- end }}
                {{- range $headerFlags }}
                {{ . }} \
                {{- end }}
                "$@"
            env:
            {{- with $krr.prometheusAuthSecret }}
            {{- if .name }}
            - name: PROMETHEUS_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ required "runner.krrCronJob.prometheusAuthSecret.key is required" .key }}
            {{- end }}
            {{- end }}
            {{- range $envName, $_ := $secretValues }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-krr-prometheus
                  key: {{ $envName }}
            {{- end }}
            {{- if .Values.openshift.enabled }}
            - name: IS_OPENSHIFT
              value: "True"
            {{- end }}
            {{- if .Values.global.enableJsonLogsFormat }}
            - name: ENABLE_JSON_LOGS_FORMAT
              value: "true"
            {{- end }}
            {{- with .Values.runner.additional_env_vars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.runner.additional_env_froms }}
            envFrom:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            resources:
              requests:
                memory: {{ $krr.memoryRequest | default $runnerEnv.KRR_MEMORY_REQUEST | default "2Gi" | quote }}
              limits:
                memory: {{ $krr.memoryLimit | default $runnerEnv.KRR_MEMORY_LIMIT | default "2Gi" | quote }}
{{- if $secretValues }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-krr-prometheus
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- toYaml $secretValues | nindent 2 }}
{{- end }}
{{- end }}
