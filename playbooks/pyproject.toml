[tool.poetry]
name = "robusta_playbooks"
version = "0.0.1"
description = ""
authors = ["Arik Alon <arikalon1@users.noreply.github.com>"]

[tool.black]
line-length = 120
target-version = ['py37']

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true

[tool.poetry.dependencies]
python = ">=3.9"
# Keep in sync with the main pyproject.toml Flask pin (CVE-2023-30861, CVE-2026-27205).
# An older cap here made pip downgrade Flask inside the Docker image after Poetry
# had already installed the patched version.
Flask = "^3.1.3"
prometheus-api-client = "^0.5.4"
pygal = "^3.0.0"
tinycss = "^0.4"
cssselect = "^1.1.0"
rsa = "^4.8"
humanize = "^3.13.1"

[tool.poetry.dev-dependencies]
robusta-api = "^0.14"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
